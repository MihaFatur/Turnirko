# Nastavitve za teste. Baza je PostgreSQL, ki ga ob zacetku testnega zagona
# zazene TestnaBaza (src/test/java/si/turnirko) - naslov poda kot sistemsko
# lastnost, zato ga tu ni. Testi se prave baze ne morejo dotakniti.
# Vse ostale nastavitve se podedujejo iz application.properties.

# Vsak Springov kontekst v predpomnilniku testov drzi svoj bazen povezav;
# brez tega bi jih vsak takoj odprl deset.
spring.datasource.hikari.minimum-idle=1

# Hibernate ob zagonu primerja vsako entiteto s shemo, ki jo je zgradil
# Flyway, in ustavi testni zagon, ce se stolpec ali njegov tip ne ujema.
# SAMO v testih: produkcija ostane na "none" (shemo ima samo Flyway).
spring.jpa.hibernate.ddl-auto=validate

# Zacetni admin brez gesla ustavi zagon (ZacetniAdmin), zato ga testom
# podamo tu. Vrednost ni skrivnost - testna baza je locena in zacasna.
turnirko.admin.privzeto-geslo=testni-admin-1234

# Posta ostane v pomnilniku: testi preberejo kodo iz besedila sporocila.
turnirko.posta.nacin=pomnilnik
# Obvestilo adminu o racunu, ki caka na potrditev, gre na ta naslov.
turnirko.posta.admin=admin@turnirko.test

# Testna skrivnost za podpis Stripe webhooka (PlacilaStoritevTest jo uporabi
# za rocno podpisan testni dogodek) - ni pravi Stripe kljuc, samo lokalni HMAC.
turnirko.stripe.webhook-skrivnost=whsec_testna_skrivnost

# Varovalka ratinga (OpravilaRatinga) obracuna koncane tekme brez obracuna.
# V testih bi segla v podatke drugih testov, zato je razmik dolg.
turnirko.rating.varovalka=PT24H
