# Migracija prezida tabelo liga, na katero kazejo tuji kljuci (ekipa, srecanje,
# spremljana_liga in liga sama prek id_visja_liga). SQLite dovoli
# "PRAGMA foreign_keys" spreminjati SAMO izven transakcije, poleg tega bi
# ALTER TABLE ... RENAME ob vklopljenih kljucih preveril celotno shemo in se
# ustavil, ker stara tabela takrat ze ne obstaja. Zato ta skripta tece brez
# ovojne transakcije - enako kot V5 in po uradnem postopku za spremembo sheme
# iz dokumentacije SQLite.
executeInTransaction=false
