# Migracija prezida tabelo ekipa, na katero kazejo tuji kljuci (kader_ekipe in
# obe strani srecanja). SQLite dovoli "PRAGMA foreign_keys" spreminjati SAMO
# izven transakcije, poleg tega bi ALTER TABLE ... RENAME ob vklopljenih
# kljucih preveril celotno shemo in se ustavil, ker stara tabela takrat ze ne
# obstaja. Zato ta skripta tece brez ovojne transakcije - enako kot V5 in V9 in
# po uradnem postopku za spremembo sheme iz dokumentacije SQLite.
executeInTransaction=false
