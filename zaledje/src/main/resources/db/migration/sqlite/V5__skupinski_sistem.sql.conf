# Migracija prezida tabeli dogodek in prijava, na kateri kazejo tuji kljuci.
# SQLite dovoli "PRAGMA foreign_keys" spreminjati SAMO izven transakcije,
# poleg tega ALTER TABLE ... RENAME ob vklopljenih kljucih preveri celotno
# shemo in bi se ustavil, ker stara tabela v tistem trenutku ze ne obstaja.
# Zato ta skripta tece brez ovojne transakcije - tako kot predpisuje uradni
# postopek za spremembo sheme v dokumentaciji SQLite.
executeInTransaction=false
