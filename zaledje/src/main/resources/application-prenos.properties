# ============================================================
# Profil "prenos" - samostojen zagon ukaza za prenos podatkov
# SQLite -> PostgreSQL (si.turnirko.prenos.PrenosUkaz).
# Vklopi se z: --spring.profiles.active=prenos (na strezniku skupaj s
#              "splet"). Baza: uporabnik mora biti lastnik sheme.
# ============================================================

# Aplikacija se ne postavi kot spletni streznik: ukaz se konca sam, tujih
# zahtev v tem casu ne sprejema nihce.
spring.main.web-application-type=none

# Prenos uporablja eno povezavo (ena transakcija).
spring.datasource.hikari.maximum-pool-size=2
