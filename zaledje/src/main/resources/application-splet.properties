# ============================================================
# Profil "splet" - nastavitve za gostovanje na strezniku.
# Vklopi se z: --spring.profiles.active=splet
#              (v Dockerju prek SPRING_PROFILES_ACTIVE=splet)
# ============================================================

# --- Za posrednikom (Caddy) ---
# Caddy prekine HTTPS in aplikacijo poklice po navadnem HTTP znotraj
# strezhnika. Brez tega bi aplikacija mislila, da tece na http:// in bi
# lahko sestavila napacne absolutne naslove; s tem prebere prave glave
# X-Forwarded-Proto / -For, ki jih postavi Caddy.
server.forward-headers-strategy=framework

# --- CORS ---
# Vmesnik je vlozen v isti .jar in tece na istem naslovu kot API, zato
# tujih izvorov ni. Prazen seznam pomeni: nihce od zunaj.
turnirko.cors.dovoljeni-izvori=

# --- Baza ---
# Pot naj pride iz okolja, da datoteka lezi na priklopljenem disku izven
# vsebnika in prezivi posodobitve:
#   SPRING_DATASOURCE_URL=jdbc:sqlite:/podatki/turnirko.db
# Privzetek spodaj velja, ce spremenljivke ni.
spring.datasource.url=jdbc:sqlite:./podatki/turnirko.db

# --- Dnevnik ---
# Na strezniku ni konzole, ki bi jo kdo gledal; zapisi naj bodo kratki in
# uporabni ob tezavah. SQL stavkov nikoli - vsebujejo osebne podatke.
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.si.turnirko=INFO

# --- Napake ---
# Sled sklada ne sme uiti v odgovor odjemalcu (razkriva zgradbo aplikacije).
server.error.include-stacktrace=never
server.error.include-message=never

# --- Zaustavitev ---
# Ob posodobitvi naj streznik dokonca zahteve, ki ze tecejo, in sele nato
# ugasne - sicer lahko sodnik sredi vnosa rezultata dobi napako.
server.shutdown=graceful

# --- E-posta ---
# Brez SMTP kode gredo v dnevnik in registracija ne deluje za nikogar zunaj
# streznika. Na spletu torej vedno nacin smtp; podatke da ponudnik
# transakcijske poste (Brevo, Postmark, Resend ...) ali gostitelj domene.
turnirko.posta.nacin=${TURNIRKO_POSTA_NACIN:dnevnik}
turnirko.posta.od=${TURNIRKO_POSTA_OD:Turnirko <posta@localhost>}
turnirko.posta.odgovor=${TURNIRKO_POSTA_ODGOVOR:}
spring.mail.host=${TURNIRKO_SMTP_STREZNIK:}
spring.mail.port=${TURNIRKO_SMTP_VRATA:587}
spring.mail.username=${TURNIRKO_SMTP_UPORABNIK:}
spring.mail.password=${TURNIRKO_SMTP_GESLO:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Placila (Stripe) ---
turnirko.stripe.tajni-kljuc=${TURNIRKO_STRIPE_TAJNI_KLJUC:}
turnirko.stripe.webhook-skrivnost=${TURNIRKO_STRIPE_WEBHOOK_SKRIVNOST:}
# Vmesnik je na spletu na isti domeni kot API (glej CORS zgoraj) - brez
# lokalnega vrat 5173.
turnirko.stripe.vrni-na=${TURNIRKO_STRIPE_VRNI_NA:https://turnirko-nt.si}
