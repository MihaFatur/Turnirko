# ============================================================
# Turnirko - glavne nastavitve aplikacije
# ============================================================

spring.application.name=turnirko

# --- Podatkovna baza (PostgreSQL) ---
# Lokalni razvoj: baza "turnirko" na lastnem racunalniku. Na strezniku naslov,
# uporabnika in geslo poda okolje (SPRING_DATASOURCE_URL ..., glej compose.yaml).
# Baza mora biti ustvarjena z razvrscanjem po kodnih tockah:
#   CREATE DATABASE turnirko ENCODING 'UTF8' LOCALE_PROVIDER builtin
#     BUILTIN_LOCALE 'C.UTF-8' TEMPLATE template0;
spring.datasource.url=jdbc:postgresql://localhost:5432/turnirko
spring.datasource.username=${TURNIRKO_BAZA_UPORABNIK:turnirko}
spring.datasource.password=${TURNIRKO_BAZA_GESLO:}
# Zahteva, ki ne dobi povezave v 5 s, naj raje pade z jasno napako, kot da
# gledalec caka 30 s (privzetek Hikari).
spring.datasource.hikari.connection-timeout=5000

# --- JPA / Hibernate ---
# Narecje (PostgreSQL) izbere Hibernate sam iz povezave.
# Shemo v celoti upravlja Flyway (mapa db/migration) - Hibernate je NE sme spreminjati
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Izklop "open session in view" - preprecuje skrite poizvedbe med izrisom odgovora
spring.jpa.open-in-view=false

# --- Predpomnilnik javnih agregatov (lestvica, seznam turnirjev ...) ---
# Vsak zapis v bazo ga razveljavi sam (PredpomnilnikBranja); veljavnost je
# varovalka za zapise mimo aplikacije (popravek v bazi na roko). PT0S ga izklopi.
turnirko.predpomnilnik.veljavnost=${TURNIRKO_PREDPOMNILNIK_VELJAVNOST:PT5M}

# --- Flyway (migracije sheme) ---
# {vendor} se zamenja z imenom baze (postgresql). Mapa sqlite/ je zgodovina
# do preklopa: produkcija tece na njej, dokler podatki niso preneseni
# (docs/PRENOVA-BAZE.md); izhodisce postgresql/ je V53.
spring.flyway.locations=classpath:db/migration/{vendor}

# --- Nalaganje slik (logotip tekmovanja, V54) ---
# Brskalnik poslje ze pomanjsan PNG (do 1200 px); meja je ista kot v
# ObdelavaSlik.NAJVEC_BAJTOV, zahteva pa ima malo prostora za glave obrazca.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# --- CORS: naslovi, s katerih sme razvojni vmesnik klicati zaledje ---
turnirko.cors.dovoljeni-izvori=http://localhost:5173

# --- Zacetni administrator (sodnik) ---
# Ustvari se ob prvem zagonu, ce v bazi se ni nobenega uporabnika.
# Gesla tu NAMENOMA ni: fiksen privzetek bi ostal na strezniku in bi bil
# odprta vrata. Podaj ga ob zagonu, npr. prek spremenljivke okolja
#   TURNIRKO_ADMIN_PRIVZETO_GESLO=<dolgo nakljucno geslo>
# Brez njega se streznik ne zazene (glej ZacetniAdmin).
turnirko.admin.uporabnisko-ime=admin

# --- E-posta (potrditvene kode, pozabljeno geslo, soglasje skrbnika) ---
# nacin: dnevnik  = brez SMTP, besedilo sporocila (s kodo) gre v dnevnik -
#                   SAMO za razvoj; registracija tako za nikogar drugega ne deluje
#        smtp     = pravo posiljanje prek spring.mail.* (glej profil splet)
#        pomnilnik = testi berejo poslano iz pomnilnika
turnirko.posta.nacin=dnevnik
# Posiljatelj, kot ga vidi prejemnik. Domena mora imeti SPF/DKIM/DMARC,
# sicer kode koncajo med nezeleno posto.
turnirko.posta.od=Turnirko <posta@localhost>
# Naslov, na katerega gre odgovor uporabnika (Reply-To). Prazno = brez glave.
# Posiljatelj zgoraj je nabiralnik brez cloveka; odgovori naj gredo v pravega.
turnirko.posta.odgovor=
# Naslov admina, ki dobi e-posto, ko racun igralca caka na potrditev (po
# potrjenem naslovu, brez samodejne povezave z igralcem). Prazno = brez obvestil.
turnirko.posta.admin=${TURNIRKO_POSTA_ADMIN:info@turnirko-nt.si}

# --- Potisna obvestila (Web Push, paket Navijac) ---
# Par kljucev VAPID ustvari `java -cp target/classes si.turnirko.pomozno.VapidKljuci`.
# Zasebni kljuc je skrivnost (okoljska spremenljivka ali config/application-<profil>.properties,
# nikoli v repozitorij); brez obeh je funkcija ugasnjena. Kljuca se ne menjata: z zamenjavo vse
# narocene naprave izgubijo obvestila.
turnirko.push.javni-kljuc=${TURNIRKO_PUSH_JAVNI_KLJUC:}
turnirko.push.zasebni-kljuc=${TURNIRKO_PUSH_ZASEBNI_KLJUC:}
turnirko.push.subjekt=${TURNIRKO_PUSH_SUBJEKT:mailto:info@turnirko-nt.si}

# --- Placila (Stripe Checkout) za placljive pakete (Premium, Organizator) ---
# TAJNI kljuc (sk_test_... / sk_live_...) - brez njega PlacilaStoritev ne more
# klicati Stripe API-ja. Podaj ga prek spremenljivke okolja, NIKOLI tu v
# cistopisu (glej primer turnirko.admin.uporabnisko-ime zgoraj):
#   TURNIRKO_STRIPE_TAJNI_KLJUC=sk_test_...
turnirko.stripe.tajni-kljuc=
# Skrivnost za preverjanje podpisa webhooka (whsec_...), iz Stripe nadzorne
# plosce (ali "stripe listen" pri lokalnem razvoju).
turnirko.stripe.webhook-skrivnost=
# Koren naslova vmesnika, kamor Stripe preusmeri brskalnik po (ne)uspelem
# placilu - brez koncne poševnice.
turnirko.stripe.vrni-na=http://localhost:5173

# --- Predogled povezav ---
# Javni naslov strani za og:url in kanonicni naslov v glavi strani lig,
# turnirjev, srecanj in profilov (splet/StraniKontroler). Brez koncne
# posevnice.
turnirko.javni-naslov=${TURNIRKO_JAVNI_NASLOV:https://turnirko-nt.si}
