# ============================================================
# Turnirko - glavne nastavitve aplikacije
# ============================================================

spring.application.name=turnirko

# --- Podatkovna baza (SQLite, lokalna datoteka v mapi podatki/) ---
spring.datasource.url=jdbc:sqlite:./podatki/turnirko.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite privzeto NE preverja tujih kljucev - vklopimo ob vsaki povezavi
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Datume shranjujemo kot besedilo v formatu ISO (npr. 2026-07-20),
# da so berljivi tudi z orodji za pregled baze
spring.datasource.hikari.data-source-properties.date_string_format=yyyy-MM-dd
spring.datasource.hikari.data-source-properties.timestamp_string_format=yyyy-MM-dd HH:mm:ss.SSS
spring.datasource.hikari.data-source-properties.date_class=text

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Shemo v celoti upravlja Flyway (mapa db/migration) - Hibernate je NE sme spreminjati
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Izklop "open session in view" - preprecuje skrite poizvedbe med izrisom odgovora
spring.jpa.open-in-view=false

# --- Flyway (migracije sheme) ---
# {vendor} se samodejno zamenja z imenom baze (sqlite, kasneje postgresql),
# da bomo ob prehodu na PostgreSQL lahko imeli locene migracije
spring.flyway.locations=classpath:db/migration/{vendor}

# --- CORS: naslovi, s katerih sme razvojni vmesnik klicati zaledje ---
turnirko.cors.dovoljeni-izvori=http://localhost:5173

# --- Zacetni administrator (sodnik) ---
# Ustvari se ob prvem zagonu, ce v bazi se ni nobenega uporabnika.
# PRIVZETO GESLO CIM PREJ ZAMENJAJ (nastavi turnirko.admin.privzeto-geslo).
turnirko.admin.uporabnisko-ime=admin
turnirko.admin.privzeto-geslo=admin
