# Celotna postavitev na strezniku: aplikacija + Caddy (HTTPS).
# Zagon:  docker compose up -d --build
# Dnevnik: docker compose logs -f app
#
# Pred prvim zagonom naredi datoteko .env po vzoru .env.primer.

services:
  app:
    build: .
    restart: unless-stopped

    # Vrat NAMENOMA ne objavljamo na strezniku (ni "ports:"). Aplikacija je
    # dosegljiva samo Caddyju po notranjem omrezju. Ce bi tu pisalo
    # "8080:8080", bi bila stran dosegljiva tudi prek http://IP:8080, torej
    # mimo HTTPS - in HTTP Basic prijava bi sla po zici v berljivi obliki.
    expose:
      - "8080"

    environment:
      SPRING_PROFILES_ACTIVE: splet
      SPRING_DATASOURCE_URL: jdbc:sqlite:/podatki/turnirko.db
      # Posnetki dogodkov Stupe (stran /uvoz). Privzeta relativna pot bi
      # kazala v /app, kamor uporabnik 10001 ne sme pisati.
      TURNIRKO_UVOZ_POSNETKI: /podatki/stupa-posnetki
      # Brez tega se aplikacija ob PRAZNI bazi noce zagnati (namerno).
      # Ko admin ze obstaja, vrednost ni vec v rabi.
      TURNIRKO_ADMIN_PRIVZETO_GESLO: ${TURNIRKO_ADMIN_GESLO:?nastavi TURNIRKO_ADMIN_GESLO v .env}
      # E-posta za potrditvene kode (registracija, pozabljeno geslo). Brez
      # SMTP gredo kode v dnevnik in registracija ne deluje - glej .env.primer.
      TURNIRKO_POSTA_NACIN: ${TURNIRKO_POSTA_NACIN:-dnevnik}
      TURNIRKO_POSTA_OD: ${TURNIRKO_POSTA_OD:-Turnirko <posta@localhost>}
      TURNIRKO_POSTA_ODGOVOR: ${TURNIRKO_POSTA_ODGOVOR:-}
      TURNIRKO_SMTP_STREZNIK: ${TURNIRKO_SMTP_STREZNIK:-}
      TURNIRKO_SMTP_VRATA: ${TURNIRKO_SMTP_VRATA:-587}
      TURNIRKO_SMTP_UPORABNIK: ${TURNIRKO_SMTP_UPORABNIK:-}
      TURNIRKO_SMTP_GESLO: ${TURNIRKO_SMTP_GESLO:-}
      # Placila (Stripe) - Premium igralca in organizatorski paketi. Brez
      # tajnega kljuca placilo ne deluje (jasna napaka, ne sesutje) - glej
      # .env.primer za navodila, kje kljuce dobis.
      TURNIRKO_STRIPE_TAJNI_KLJUC: ${TURNIRKO_STRIPE_TAJNI_KLJUC:-}
      TURNIRKO_STRIPE_WEBHOOK_SKRIVNOST: ${TURNIRKO_STRIPE_WEBHOOK_SKRIVNOST:-}

    volumes:
      # Baza lezi na strezniku, ne v vsebniku - tako prezivi vsako
      # posodobitev aplikacije. Mapa mora pripadati uporabniku 10001
      # iz slike:  sudo chown -R 10001:10001 podatki
      - ./podatki:/podatki

    # Ce se aplikacija sesuje, naj jo Docker znova zazene, a ne v nedogled.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/klubi > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Statistika obiska (Umami): pregled na https://statistika.turnirko-nt.si.
  # Ne uporablja piskotkov in ne hrani naslovov IP, zato pasica za soglasje
  # ni potrebna. Podatki ostanejo na tem strezniku. Prva namestitev:
  # docs/OBJAVA.md, razdelek "Statistika obiska".
  umami:
    # Tocna razlicica, ne "latest": posodobitev naj bo tvoja odlocitev, ne
    # stranski ucinek ponovnega zagona.
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    # Tako kot pri aplikaciji: brez "ports:", dosegljiv samo skozi Caddy.
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_BAZA_GESLO:?nastavi UMAMI_BAZA_GESLO v .env - glej docs/OBJAVA.md}@umami-baza:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?nastavi UMAMI_APP_SECRET v .env - glej docs/OBJAVA.md}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_KLJUC:?nastavi UMAMI_2FA_KLJUC v .env - glej docs/OBJAVA.md}
      # Privzeto ime "script.js" blokatorji oglasov poznajo; drugo ime jih
      # vecino zaobide, zato so stevilke blizje resnici.
      TRACKER_SCRIPT_NAME: obisk.js
      DISABLE_TELEMETRY: 1
    depends_on:
      umami-baza:
        condition: service_healthy

  umami-baza:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      # Velja SAMO ob prvem zagonu (ko je zvezek se prazen). Kasnejsa
      # sprememba v .env gesla v bazi ne spremeni - Umami se takrat ne
      # more vec povezati.
      POSTGRES_PASSWORD: ${UMAMI_BAZA_GESLO:?nastavi UMAMI_BAZA_GESLO v .env - glej docs/OBJAVA.md}
    volumes:
      - umami_baza:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"    # potreben za preverbo lastnistva domene (Let's Encrypt)
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Tu Caddy hrani pridobljene certifikate. Brez tega bi jih ob vsakem
      # ponovnem zagonu zahteval znova in bi hitro naletel na omejitve
      # Let's Encrypta.
      - caddy_podatki:/data
      - caddy_nastavitve:/config
      - ./dnevniki:/var/log/caddy
    depends_on:
      - app

volumes:
  caddy_podatki:
  caddy_nastavitve:
  umami_baza:
