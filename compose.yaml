# Celotna postavitev na strezniku: aplikacija + baza PostgreSQL + Caddy (HTTPS).
# Zagon:  docker compose up -d --build
# Dnevnik: docker compose logs -f app   (baza: docker compose logs -f baza)
#
# Pred prvim zagonom naredi datoteko .env po vzoru .env.primer.

services:
  app:
    build: .
    restart: unless-stopped

    # Vrat NAMENOMA ne objavljamo na strezniku (ni "ports:"). Aplikacija je
    # dosegljiva samo Caddyju po notranjem omrezju. Ce bi tu pisalo
    # "8080:8080", bi bila stran dosegljiva tudi prek http://IP:8080, torej
    # mimo HTTPS - in HTTP Basic prijava bi sla po zici v berljivi obliki.
    expose:
      - "8080"

    environment:
      SPRING_PROFILES_ACTIVE: splet
      # Baza je ločen vsebnik (storitev "baza" spodaj). Aplikacija se prijavi z
      # vlogo turnirko_app, ki sme samo brati in pisati vrstice; sheme ne
      # more spremeniti ne zbrisati. Shemo ob zagonu gradi Flyway z vlogo
      # turnirko_lastnik (docs/OBJAVA.md, razdelek 4).
      SPRING_DATASOURCE_URL: jdbc:postgresql://baza:5432/turnirko
      TURNIRKO_BAZA_UPORABNIK: turnirko_app
      TURNIRKO_BAZA_GESLO: ${TURNIRKO_BAZA_APP_GESLO:?nastavi TURNIRKO_BAZA_APP_GESLO v .env - glej docs/OBJAVA.md}
      SPRING_FLYWAY_USER: turnirko_lastnik
      SPRING_FLYWAY_PASSWORD: ${TURNIRKO_BAZA_LASTNIK_GESLO:?nastavi TURNIRKO_BAZA_LASTNIK_GESLO v .env - glej docs/OBJAVA.md}
      # Posnetki dogodkov Stupe (stran /uvoz). Privzeta relativna pot bi
      # kazala v /app, kamor uporabnik 10001 ne sme pisati.
      TURNIRKO_UVOZ_POSNETKI: /podatki/stupa-posnetki
      # Brez tega se aplikacija ob PRAZNI bazi noce zagnati (namerno).
      # Ko admin ze obstaja, vrednost ni vec v rabi.
      TURNIRKO_ADMIN_PRIVZETO_GESLO: ${TURNIRKO_ADMIN_GESLO:?nastavi TURNIRKO_ADMIN_GESLO v .env}
      # E-posta za potrditvene kode (registracija, pozabljeno geslo). Brez
      # SMTP gredo kode v dnevnik in registracija ne deluje - glej .env.primer.
      TURNIRKO_POSTA_NACIN: ${TURNIRKO_POSTA_NACIN:-dnevnik}
      TURNIRKO_POSTA_OD: ${TURNIRKO_POSTA_OD:-Turnirko <posta@localhost>}
      TURNIRKO_POSTA_ODGOVOR: ${TURNIRKO_POSTA_ODGOVOR:-}
      # Kam gre obvestilo, da racun igralca caka na potrditev (glej .env.primer).
      # Brez dvopicja: privzeti naslov velja samo, ce spremenljivke ni; prazna
      # vrednost v .env obvestila izklopi.
      TURNIRKO_POSTA_ADMIN: ${TURNIRKO_POSTA_ADMIN-info@turnirko-nt.si}
      TURNIRKO_SMTP_STREZNIK: ${TURNIRKO_SMTP_STREZNIK:-}
      TURNIRKO_SMTP_VRATA: ${TURNIRKO_SMTP_VRATA:-587}
      TURNIRKO_SMTP_UPORABNIK: ${TURNIRKO_SMTP_UPORABNIK:-}
      TURNIRKO_SMTP_GESLO: ${TURNIRKO_SMTP_GESLO:-}
      # Placila (Stripe) - Premium igralca in organizatorski paketi. Brez
      # tajnega kljuca placilo ne deluje (jasna napaka, ne sesutje) - glej
      # .env.primer za navodila, kje kljuce dobis.
      TURNIRKO_STRIPE_TAJNI_KLJUC: ${TURNIRKO_STRIPE_TAJNI_KLJUC:-}
      TURNIRKO_STRIPE_WEBHOOK_SKRIVNOST: ${TURNIRKO_STRIPE_WEBHOOK_SKRIVNOST:-}

    volumes:
      # Mapa za datoteke aplikacije (posnetki Stupe, porocila uvoza in prenosa).
      # Same baze tu ni vec: leži v zvezku vsebnika "baza". Mapa mora pripadati
      # uporabniku 10001 iz slike:  sudo chown -R 10001:10001 podatki
      - ./podatki:/podatki

    # Aplikacija brez baze ne more nicesar; naj pocaka, da je PostgreSQL
    # pripravljen (healthcheck spodaj), sicer bi se ob vsakem zagonu sesula.
    depends_on:
      baza:
        condition: service_healthy

    # Ce se aplikacija sesuje, naj jo Docker znova zazene, a ne v nedogled.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/klubi > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Baza PostgreSQL (docs/PRENOVA-BAZE.md, docs/OBJAVA.md razdelek 4).
  # Locena od baze Umamija (umami-baza): drug zivljenjski cikel, druge kopije.
  baza:
    # Tocna razlicica, kot pri Umamiju: posodobitev je tvoja odlocitev. Manjse
    # razlicice (18.x) so varne; glavno (19) prestavi sele po navodilu v
    # docs/OBJAVA.md.
    image: postgres:18.6
    restart: unless-stopped
    # Pocasna ugasnitev ni napaka: PostgreSQL pred izhodom zapise vse na disk.
    stop_grace_period: 60s
    # Privzetih 64 MB je premalo za vzporedne poizvedbe.
    shm_size: 256mb
    # Kot aplikacija: brez "ports:". Do baze pride samo aplikacija po
    # notranjem omrezju. Za pregled od doma uporabi SSH-tunel (OBJAVA.md).
    expose:
      - "5432"
    environment:
      TZ: Europe/Ljubljana
      POSTGRES_DB: turnirko
      # Skrbnik (postgres) je samo za vzdrzevanje prek "docker compose exec";
      # aplikacija ga ne uporablja nikoli.
      POSTGRES_PASSWORD: ${TURNIRKO_BAZA_ADMIN_GESLO:?nastavi TURNIRKO_BAZA_ADMIN_GESLO v .env - glej docs/OBJAVA.md}
      # Razvrscanje po kodnih tockah (C.UTF-8) - tako kot SQLite. Slovenski
      # abecedni red ureja Java; spremenjen vrstni red v bazi bi razdrl vse,
      # kar ga predpostavlja. Skripta 00-vloge.sh preveri, da je res tako.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=builtin --builtin-locale=C.UTF-8
      # Gesli vlog (skripta 00-vloge.sh ju prebere ob PRVEM zagonu).
      TURNIRKO_BAZA_LASTNIK_GESLO: ${TURNIRKO_BAZA_LASTNIK_GESLO:?nastavi TURNIRKO_BAZA_LASTNIK_GESLO v .env - glej docs/OBJAVA.md}
      TURNIRKO_BAZA_APP_GESLO: ${TURNIRKO_BAZA_APP_GESLO:?nastavi TURNIRKO_BAZA_APP_GESLO v .env - glej docs/OBJAVA.md}
    # Nastavitve za VPS s 4 GB pomnilnika. Pri 2 GB vse tri vrednosti
    # prepolovi (BAZA_SHARED_BUFFERS=256MB, BAZA_CACHE=512MB, BAZA_DELO=8MB v .env).
    command:
      - postgres
      - -c
      - shared_buffers=${BAZA_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${BAZA_CACHE:-1GB}
      - -c
      - work_mem=${BAZA_DELO:-16MB}
      - -c
      - max_connections=50
      - -c
      - timezone=Europe/Ljubljana
      # Pocasne poizvedbe gredo v dnevnik (docker compose logs baza), zaklepi,
      # na katere se caka dlje kot sekundo, tudi.
      - -c
      - log_min_duration_statement=250ms
      - -c
      - log_lock_waits=on
      - -c
      - "log_line_prefix=%t [%p] %u@%d "
      # Statistika poizvedb za "teden opazovanja" po preklopu (skripte/baza-stanje.sh).
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      # PostgreSQL 18 hrani podatke v podmapi te poti. Zvezka NIKOLI ne
      # kopiraj kot mapo; kopije so samo pg_dump (skripte/varnostna-kopija.sh).
      - turnirko_baza:/var/lib/postgresql
      # Ob prvem zagonu (prazen zvezek) ustvari vlogi in pravice.
      - ./skripte/baza/00-vloge.sh:/docker-entrypoint-initdb.d/00-vloge.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d turnirko"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Statistika obiska (Umami): pregled na https://statistika.turnirko-nt.si.
  # Ne uporablja piskotkov in ne hrani naslovov IP, zato pasica za soglasje
  # ni potrebna. Podatki ostanejo na tem strezniku. Prva namestitev:
  # docs/OBJAVA.md, razdelek "Statistika obiska".
  umami:
    # Tocna razlicica, ne "latest": posodobitev naj bo tvoja odlocitev, ne
    # stranski ucinek ponovnega zagona.
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    # Tako kot pri aplikaciji: brez "ports:", dosegljiv samo skozi Caddy.
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_BAZA_GESLO:?nastavi UMAMI_BAZA_GESLO v .env - glej docs/OBJAVA.md}@umami-baza:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?nastavi UMAMI_APP_SECRET v .env - glej docs/OBJAVA.md}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_KLJUC:?nastavi UMAMI_2FA_KLJUC v .env - glej docs/OBJAVA.md}
      # Privzeto ime "script.js" blokatorji oglasov poznajo; drugo ime jih
      # vecino zaobide, zato so stevilke blizje resnici.
      TRACKER_SCRIPT_NAME: obisk.js
      DISABLE_TELEMETRY: 1
    depends_on:
      umami-baza:
        condition: service_healthy

  umami-baza:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      # Velja SAMO ob prvem zagonu (ko je zvezek se prazen). Kasnejsa
      # sprememba v .env gesla v bazi ne spremeni - Umami se takrat ne
      # more vec povezati.
      POSTGRES_PASSWORD: ${UMAMI_BAZA_GESLO:?nastavi UMAMI_BAZA_GESLO v .env - glej docs/OBJAVA.md}
    volumes:
      - umami_baza:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"    # potreben za preverbo lastnistva domene (Let's Encrypt)
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Tu Caddy hrani pridobljene certifikate. Brez tega bi jih ob vsakem
      # ponovnem zagonu zahteval znova in bi hitro naletel na omejitve
      # Let's Encrypta.
      - caddy_podatki:/data
      - caddy_nastavitve:/config
      - ./dnevniki:/var/log/caddy
    depends_on:
      - app

volumes:
  turnirko_baza:
  caddy_podatki:
  caddy_nastavitve:
  umami_baza:
