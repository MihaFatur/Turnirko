<!doctype html>
<!-- Ikona aplikacije (bliznjica na zacetnem zaslonu, manifest, apple-touch-icon).
     Znak je logotip strani - stiri poteze iz favicon.svg (crnilo, crnilo,
     modra, zelena) na papirju. Poteze zasedajo srednjih 60 %: iOS ikoni
     zaobli vogale, Android jo obreze v krog ali kvadrat (maskable), zato mora
     znak ostati v varnem obmocju. Izris: skripte/ikone/naredi.sh. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; background: #FBF9F5; }
      svg { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="100" height="100" fill="#FBF9F5" />
      <rect x="20" y="25" width="7.5" height="50" fill="#14110F" />
      <rect x="37.5" y="25" width="7.5" height="50" fill="#14110F" />
      <rect x="55" y="25" width="7.5" height="50" fill="#0088CE" />
      <rect x="72.5" y="25" width="7.5" height="50" fill="#7BB900" />
    </svg>
  </body>
</html>
