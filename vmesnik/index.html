    <!-- Blok med oznakama predogled je naslov in predogled strani. Strežnik ga

      content="Rezultati turnirjev v živo, lige, koledar tekmovanj, lestvica igralcev in profili s statistiko."

    <!-- Lastnik izključi svoje oglede statistike tudi na telefonu, kjer konzole
         ni: /?statistika=izklop (nazaj /?statistika=vklop). Velja za ta
         brskalnik; teče pred skriptom spodaj, zato se že ta ogled ne šteje. -->
    <script>
      try {
        const statistika = new URLSearchParams(location.search).get('statistika')
        if (statistika === 'izklop') {
          localStorage.setItem('umami.disabled', '1')
          alert('Statistika: ogledi iz tega brskalnika se ne štejejo več.')
        } else if (statistika === 'vklop') {
          localStorage.removeItem('umami.disabled')
          alert('Statistika: ogledi iz tega brskalnika se spet štejejo.')
        }
      } catch (e) {}
    </script>
    <!-- Testno okolje (test.turnirko-nt.si, glej docs/TESTNO-OKOLJE.md): rjast
         trak na vrhu in tanka črta ob robu, da test ne zamenjaš s pravo stranjo.
         Na drugih naslovih (razen test.localhost) ne naredi ničesar. -->
    <script>
      try {
        if (location.hostname.indexOf('test.') === 0) {
          const crta = document.createElement('div')
          crta.setAttribute('aria-hidden', 'true')
          crta.style.cssText = 'position:fixed;top:0;left:0;right:0;height:4px;background:#b23a1e;z-index:2147483647;pointer-events:none'
          const trak = document.createElement('div')
          trak.setAttribute('role', 'note')
          trak.textContent = 'TESTNO OKOLJE · podatki so kopija in se prepišejo'
          trak.style.cssText = 'background:#b23a1e;color:#fff;font:600 12px/1.3 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.04em;padding:6px 16px;text-align:center'
          document.addEventListener('DOMContentLoaded', function () {
            document.body.insertBefore(trak, document.body.firstChild)
            document.body.appendChild(crta)
          })
        }
      } catch (e) {}
    </script>
    <!-- Statistika šteje samo ljudi (27. 11. 2026). Od 20. 10. stran prebira
         samodejni brskalnik, ki se seli med oblaki (Tencent, Alibaba) in
         domačimi priključki tujih ljudi, zato ga po naslovu ni mogoče ustaviti
         (glej blokado v Caddyfile). Skupno mu je, da odpre eno stran in po
         2–3 s odide, ne da bi se je dotaknil. Umami zato ogled ali dogodek
         pošlje šele, ko je na strani človek: dotik, klik, premik miške, tipka
         ali kolešček, ali 15 s vidne strani (kdor samo bere). Kdor odide prej
         in se strani ne dotakne, se ne šteje. Pomik strani (scroll) ni znak,
         ker ga sproži tudi vmesnik sam. Umami čaka na odgovor te funkcije
         (data-before-send; obisk.js kliče await Promise.resolve(...)), zato jo
         lahko zadrži; ogled, ki ne dočaka človeka, se nikoli ne pošlje. -->
    <script>
      try {
        ;(function () {
          const ZNAKI = ['pointerdown', 'pointermove', 'touchstart', 'keydown', 'wheel']
          const VIDNO_DOVOLJ_MS = 15000
          let clovek = false
          let vidnoMs = 0
          let ura = 0
          const cakajo = []
          function potrdi() {
            if (clovek) return
            clovek = true
            clearInterval(ura)
            ZNAKI.forEach(function (z) {
              removeEventListener(z, potrdi, true)
            })
            cakajo.splice(0).forEach(function (spusti) {
              spusti()
            })
          }
          ZNAKI.forEach(function (z) {
            addEventListener(z, potrdi, { capture: true, passive: true })
          })
          ura = setInterval(function () {
            if (document.visibilityState !== 'visible') return
            vidnoMs += 1000
            if (vidnoMs >= VIDNO_DOVOLJ_MS) potrdi()
          }, 1000)
          window.turnirkoClovek = function (vrsta, podatki) {
            if (clovek) return podatki
            return new Promise(function (spusti) {
              cakajo.push(function () {
                spusti(podatki)
              })
            })
          }
        })()
      } catch (e) {}
    </script>
    <!-- Statistika obiska (Umami, glej docs/OBJAVA.md, razdelek 8). Šteje samo
         na pravi domeni (data-domains), zato razvoj in namizna različica ne
         pošiljata ničesar; defer pomeni, da stran brez interneta ne čaka nanj.
         data-before-send: zgornja funkcija, ki ogled zadrži do človeka. -->
    <script
      defer
      src="https://statistika.turnirko-nt.si/obisk.js"
      data-website-id="6bf90444-b1dd-4a71-8ca6-cf935b218c10"
      data-domains="turnirko-nt.si,www.turnirko-nt.si"
      data-before-send="turnirkoClovek"
    ></script>
  </head>

    <div id="koren"></div>

      <h1>Turnirko</h1>
      <p>Turnirji, lige, koledar tekmovanj in lestvica igralcev v namiznem tenisu. Za ogled vklopite JavaScript.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
